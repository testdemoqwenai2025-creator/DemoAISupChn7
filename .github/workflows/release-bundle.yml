name: Build & Release Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.1.0)'
        required: true
        default: 'v3.1.0'

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version info
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ] || [ "$VERSION" == "refs/tags/" ]; then
            VERSION="${{ github.event.inputs.version || v3.1.0 }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Create bundle manifest
        run: |
          cat > BUILD_INFO.json << EOF
          {
            "version": "$VERSION",
            "buildDate": "$BUILD_DATE",
            "commit": "$COMMIT",
            "repository": "AISupChn6-Advanced",
            "description": "AI Supply Chain Advanced — Enterprise Intelligence Platform (Static Bundle)",
            "pages": [
              "index.html", "dashboard.html", "dashboard-enhanced.html",
              "intelligence.html", "intelligence-enhanced.html",
              "platform.html", "platform-enhanced.html",
              "industries.html", "customers.html", "product.html",
              "about.html", "support.html", "events.html", "pricing.html"
            ],
            "modules": [
              "cc-app/ (Next.js Command Center SPA)"
            ]
          }
          EOF

      - name: Package release bundle
        run: |
          mkdir -p dist
          # Copy all deployable files
          cp index.html dist/
          cp dashboard.html dist/
          cp dashboard-enhanced.html dist/
          cp intelligence.html dist/
          cp intelligence-enhanced.html dist/
          cp platform.html dist/
          cp platform-enhanced.html dist/
          cp industries.html dist/
          cp customers.html dist/
          cp product.html dist/
          cp about.html dist/
          cp support.html dist/
          cp events.html dist/
          cp pricing.html dist/
          cp 404.html dist/ 2>/dev/null || true
          cp .nojekyll dist/
          cp BUILD_INFO.json dist/
          
          # Copy cc-app directory
          cp -r cc-app dist/cc-app
          
          # Create zip archives
          cd dist
          zip -r ../aisupplychain-advanced-${VERSION}.zip . -x '*.DS_Store'
          tar -czf ../aisupplychain-advanced-${VERSION}.tar.gz .
          cd ..
          
          # Generate SHA256 checksums
          sha256sum aisupplychain-advanced-${VERSION}.zip > aisupplychain-advanced-${VERSION}.sha256
          sha256sum aisupplychain-advanced-${VERSION}.tar.gz >> aisupplychain-advanced-${VERSION}.sha256
          
          echo "Bundle size:"
          ls -lh aisupplychain-advanced-${VERSION}.*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "AI Supply Chain Advanced ${{ env.VERSION }}"
          body: |
            ## AI Supply Chain Advanced — ${{ env.VERSION }}

            **Static site bundle** — deploy anywhere (GitHub Pages, S3, Netlify, Vercel, Nginx, or open `index.html` directly in a browser).

            ### What's Included
            - 14 HTML pages (dashboard, intelligence, platform, pricing, etc.)
            - Command Center SPA (`cc-app/` directory)
            - Unified footer with GDPR, social media, and contact info
            - Login/Get Started modals
            - Responsive design (desktop, tablet, mobile)

            ### Deployment
            1. Download the `.zip` or `.tar.gz`
            2. Extract to any web server root
            3. Or serve locally: `python3 -m http.server 8080 --directory dist`
            4. Open `index.html`

            ### Files
            | File | Size |
            |------|------|
            | `.zip` | ${{ env.ZIP_SIZE }} |
            | `.tar.gz` | ${{ env.TGZ_SIZE }} |
            | `.sha256` | Checksums |

            **Build:** ${{ env.COMMIT }} | **Date:** ${{ env.BUILD_DATE }}
          draft: false
          prerelease: false
          files: |
            aisupplychain-advanced-${{ env.VERSION }}.zip
            aisupplychain-advanced-${{ env.VERSION }}.tar.gz
            aisupplychain-advanced-${{ env.VERSION }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: also deploy to GitHub Pages on release
  deploy-on-release:
    needs: build-bundle
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Trigger Pages Deploy
        run: |
          echo "Release ${{ env.VERSION }} published. GitHub Pages deployment is handled by the main branch push workflow."
